<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutevo · App</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M11 35 C 20 35, 22 13, 33 13' stroke='%232563EB' stroke-width='4.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='11' cy='35' r='5.2' fill='%232563EB'/%3E%3Ccircle cx='33' cy='13' r='6.2' fill='%2310B981'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: '#2563EB', accent: '#10B981' } } } };
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  [x-cloak]{display:none}
</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<!-- ===== LOGO (inline component) ===== -->
<template id="logo-tpl">
  <svg width="30" height="30" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Rutevo">
    <path d="M11 35 C 20 35, 22 13, 33 13" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="11" cy="35" r="5.2" fill="#2563EB"/>
    <circle cx="33" cy="13" r="6.2" fill="#10B981"/>
    <circle cx="33" cy="13" r="2.4" fill="#f7f9fc"/>
  </svg>
</template>

<!-- ===== LOGIN ===== -->
<div id="view-login" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="flex items-center gap-2 mb-6">
      <span id="login-logo"></span>
      <span class="text-2xl font-extrabold tracking-tight">rutev<span class="text-brand">o</span></span>
    </div>
    <h1 class="text-lg font-semibold mb-1">Entrar</h1>
    <p class="text-sm text-slate-500 mb-6">Panel de gestión de pedidos</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input id="email" type="email" required autocomplete="username"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand"
          placeholder="tucorreo@empresa.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand"
          placeholder="••••••••">
      </div>
      <p id="login-error" class="text-sm text-red-600 hidden"></p>
      <button type="submit" id="login-btn"
        class="w-full bg-brand hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
        Entrar
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-slate-100">
      <p class="text-xs text-slate-400 mb-2">Accesos demo (pruebas):</p>
      <div class="flex gap-2">
        <button data-demo="demo.hcl@rutevo.app" class="demo-btn flex-1 text-xs border border-slate-200 rounded-lg py-1.5 hover:bg-slate-50">Demo HCL</button>
        <button data-demo="demo.acme@rutevo.app" class="demo-btn flex-1 text-xs border border-slate-200 rounded-lg py-1.5 hover:bg-slate-50">Demo ACME</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="view-app" class="hidden min-h-screen flex flex-col">
  <!-- Topbar -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span id="app-logo"></span>
        <span class="text-lg font-extrabold tracking-tight">rutev<span class="text-brand">o</span></span>
        <span id="tenant-badge" class="ml-3 text-xs font-semibold bg-brand/10 text-brand px-2.5 py-1 rounded-full"></span>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-email" class="text-sm text-slate-500 hidden sm:block"></span>
        <button id="logout-btn" class="text-sm text-slate-600 hover:text-slate-900 border border-slate-200 rounded-lg px-3 py-1.5">Salir</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-xl font-bold">Pedidos</h1>
        <p id="orders-count" class="text-sm text-slate-500"></p>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-500 text-left">
            <tr>
              <th class="px-4 py-3 font-medium">Referencia</th>
              <th class="px-4 py-3 font-medium">Cliente</th>
              <th class="px-4 py-3 font-medium">Estado</th>
              <th class="px-4 py-3 font-medium">Destino</th>
              <th class="px-4 py-3 font-medium">Fecha</th>
            </tr>
          </thead>
          <tbody id="orders-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
      <div id="orders-empty" class="hidden px-4 py-12 text-center text-slate-400 text-sm">
        No hay pedidos todavía.
      </div>
    </div>
  </main>
</div>

<script>
/// ===== Config (claves públicas — seguras en frontend) =====
const SUPABASE_URL = 'https://bcfeawgxswvtlklrkzii.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eSca9huQfloG321aY7UV9A_m50pucxw';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== Helpers =====
const $ = (id) => document.getElementById(id);
const logoHTML = document.getElementById('logo-tpl').innerHTML;
$('login-logo').innerHTML = logoHTML;
$('app-logo').innerHTML = logoHTML;

const STATUS = {
  recibido:   { label: 'Recibido',   cls: 'bg-slate-100 text-slate-600' },
  picking:    { label: 'Picking',    cls: 'bg-amber-100 text-amber-700' },
  picked:     { label: 'Preparado',  cls: 'bg-indigo-100 text-indigo-700' },
  enviado:    { label: 'Enviado',    cls: 'bg-emerald-100 text-emerald-700' },
  incidencia: { label: 'Incidencia', cls: 'bg-red-100 text-red-700' },
};

function showLogin() { $('view-login').classList.remove('hidden'); $('view-app').classList.add('hidden'); }
function showApp()   { $('view-login').classList.add('hidden');    $('view-app').classList.remove('hidden'); }

function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' }); }
  catch { return ''; }
}
function shipTo(j) {
  if (!j) return '—';
  const p = [j.name, j.city, j.country].filter(Boolean);
  return p.join(' · ') || '—';
}

// ===== Auth =====
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('login-btn');
  const err = $('login-error');
  err.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Entrando…';
  const { error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value,
  });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) {
    err.textContent = 'No se pudo entrar: ' + error.message;
    err.classList.remove('hidden');
    return;
  }
  await loadApp();
});

document.querySelectorAll('.demo-btn').forEach(b => {
  b.addEventListener('click', () => {
    $('email').value = b.dataset.demo;
    $('password').value = 'Rutevo2026!';
  });
});

$('logout-btn').addEventListener('click', async () => {
  await db.auth.signOut();
  showLogin();
});

// ===== Data =====
async function loadApp() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) { showLogin(); return; }
  $('user-email').textContent = user.email;

  const { data: tenants } = await db.from('tenants').select('name,archetype').limit(1);
  const t = tenants && tenants[0];
  $('tenant-badge').textContent = t ? `${t.name} · ${t.archetype}` : '—';

  const { data: orders, error } = await db
    .from('orders')
    .select('external_ref,status,created_at,ship_to,clients(name)')
    .order('created_at', { ascending: false });

  const body = $('orders-body');
  body.innerHTML = '';
  if (error) {
    $('orders-count').textContent = 'Error cargando pedidos: ' + error.message;
    showApp(); return;
  }
  $('orders-count').textContent = `${orders.length} pedido(s)`;
  $('orders-empty').classList.toggle('hidden', orders.length > 0);

  for (const o of orders) {
    const s = STATUS[o.status] || { label: o.status, cls: 'bg-slate-100 text-slate-600' };
    const tr = document.createElement('tr');
    tr.className = 'hover:bg-slate-50';
    tr.innerHTML = `
      <td class="px-4 py-3 font-medium">${o.external_ref ?? '—'}</td>
      <td class="px-4 py-3 text-slate-600">${o.clients?.name ?? '—'}</td>
      <td class="px-4 py-3"><span class="text-xs font-semibold px-2.5 py-1 rounded-full ${s.cls}">${s.label}</span></td>
      <td class="px-4 py-3 text-slate-600">${shipTo(o.ship_to)}</td>
      <td class="px-4 py-3 text-slate-500">${fmtDate(o.created_at)}</td>`;
    body.appendChild(tr);
  }
  showApp();
}

// ===== Init =====
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) await loadApp(); else showLogin();
})();
</script>
</body>
</html>
