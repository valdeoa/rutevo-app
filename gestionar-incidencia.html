        note.id='rt-session-note';
        note.style.cssText='position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; background: rgb(14, 31, 61); color: rgb(255, 255, 255); border-radius: 6px; padding: 10px 16px; font-family: "Hanken Grotesk", system-ui, sans-serif; font-size: 12.5px; font-weight: 600; box-shadow: rgba(19, 32, 56, 0.25) 0px 4px 16px; display: none;';

      note.textContent=txt;
      note.style.display='block';
    }

    /* --- deteccion de fallo de credencial (desfase de reloj, token caducado) --- */
    function isAuthErr(e){
      if(!e) return false;
      const m=String(e.message||e.msg||e.error_description||'').toLowerCase();
      const c=String(e.code||e.status||'');
      return m.indexOf('jwt')>=0 || m.indexOf('issued at future')>=0 || m.indexOf('expired')>=0
          || m.indexOf('invalid claim')>=0 || c==='401' || c==='PGRST301';
    }

    let reloading=false;
    function reloadOnce(){
      if(reloading) return; reloading=true;
      let done=false;
      try{ done=sessionStorage.getItem('rt-jwt-reload')==='1'; }catch(e){}
      if(done) return;
      try{ sessionStorage.setItem('rt-jwt-reload','1'); }catch(e){}
      setTimeout(function(){ try{ location.reload(); }catch(e){} },1200);
    }
    try{ if(sessionStorage.getItem('rt-jwt-reload')==='1') setTimeout(function(){ try{ sessionStorage.removeItem('rt-jwt-reload'); }catch(e){} },8000); }catch(e){}

    const CHAIN=['select','insert','update','upsert','delete','eq','neq','gt','gte','lt','lte','like','ilike','is','in','contains','containedBy','overlaps','textSearch','match','not','or','filter','order','limit','range','abortSignal','single','maybeSingle','csv','geojson','explain','rollback','returns'];
    function wrap(db){
      return {

        auth:db.auth,

            let q=db.from(table);
            calls.forEach(function(c){ if(typeof q[c[0]]==='function') q=q[c[0]].apply(q,c[1]); });
            return q;
          }
          p.then=function(onOk,onErr){

                return Promise.resolve(build()).then(function(r2){
                  if(r2&&r2.error&&isAuthErr(r2.error)){
                    /* sigue fallando: ni un mensaje crudo, aviso + recarga */
                    reloadOnce();
                    return {data:[],error:null,count:0,__rtSession:true};

          p.finally=function(f){ return p.then(function(v){f();return v;},function(e){f();throw e;}); };

        }

    const {data:{session}}=await raw.auth.getSession();
    if(!session){ location.replace("/login"); return; }
    window.__rtwrap=wrap;
    window.__db=wrap(raw);

  if(tenant){
    if($('rt-tname')) $('rt-tname').textContent=tenant.name;
    if($('rt-tsub')) $('rt-tsub').textContent=A[tenant.archetype]||tenant.archetype||'';
    if($('rt-tavatar')) $('rt-tavatar').textContent=(tenant.name||'?').trim().charAt(0).toUpperCase();
  }
  const email=(user&&user.email)||'';
  if(email&&$('rt-uinit')){
    const p=email.split('@')[0].split(/[._-]+/).filter(Boolean);
    let ini=((p[0]||'')[0]||'')+((p[1]||'')[0]||'');
    if(!ini) ini=email.slice(0,2);
    $('rt-uinit').textContent=ini.toUpperCase();
  }

  /* ---- campana: nº de alertas + enlace a /agenda/alertas ---- */
  const bell=$('rt-bell')||document.querySelector('button[aria-label="Notificaciones"]');
  if(bell){
    bell.style.cursor='pointer';
    bell.setAttribute('title','Alertas: pedidos fuera de plazo e incidencias abiertas');
    bell.addEventListener('click', function(){ location.href='/agenda/alertas'; });
    let dot=$('rt-belldot')||bell.querySelector('span');
    if(!dot){ dot=document.createElement('span'); bell.appendChild(dot); }
    dot.id='rt-belldot';
    dot.style.display='none';
    try{
      const res=await Promise.all([
        db.from('orders').select('status,created_at,clients(sla_days)'),
        db.from('incidents').select('estado')
      ]);
      const CLOSED=['cerrada','cerrado','resuelta','resuelto','closed','resolved','anulada','anulado'];
      let late=0;
      (res[0].data||[]).forEach(function(o){
        if(o.status==='enviado') return;
        const cr=new Date(o.created_at); cr.setHours(0,0,0,0);
        const sla=(o.clients&&o.clients.sla_days!=null)?o.clients.sla_days:1;
        if(cr.getTime()+sla*DAYMS<T0) late++;
      });
      const open=(res[1].data||[]).filter(i=>CLOSED.indexOf(String(i.estado||'').toLowerCase())<0).length;
      const total=late+open;
      if(total>0){
        dot.textContent=(total>99?'99+':String(total));
        dot.style.cssText='position: absolute; top: -6px; right: -6px; min-width: 17px; height: 17px; padding: 0px 4px; box-sizing: border-box; border-radius: 9px; background: rgb(239, 68, 68); color: rgb(255, 255, 255); border: 1.5px solid rgb(255, 255, 255); font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; line-height: 14px; text-align: center; display: block;';
        bell.setAttribute('title',total+' alerta'+(total===1?'':'s')+': '+late+' fuera de plazo · '+open+' incidencia'+(open===1?'':'s')+' abierta'+(open===1?'':'s'));
      }
    }catch(e){}
  }

  /* ---- avatar: menú de usuario + cerrar sesión ---- */
  const av=$('rt-uinit');
  if(av){
    const host=av.parentElement||av;
    host.style.position='relative';
    av.style.cursor='pointer';
    av.setAttribute('title','Cuenta');
    const menu=document.createElement('div');
    menu.id='rt-usermenu';
    menu.style.cssText='position: absolute; top: 44px; right: 0px; z-index: 140; width: 244px; background: rgb(255, 255, 255); border: 1px solid rgb(221, 225, 233); border-radius: 8px; box-shadow: rgba(19, 32, 56, 0.16) 0px 6px 20px; overflow: hidden; display: none; text-align: left;';
    menu.innerHTML='<div style="padding: 13px 15px 12px; border-bottom: 1px solid rgb(232, 234, 239); background: rgb(250, 251, 252);">'
      +'<div style="font-size: 9.5px; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; color: rgb(154, 164, 184);">Sesión</div>'
      +'<div style="font-size: 13px; font-weight: 600; color: rgb(19, 32, 56); margin-top: 5px; word-break: break-all; line-height: 1.35;">'+esc(email||'—')+'</div>'
      +'<div style="font-size: 12px; color: rgb(105, 117, 141); margin-top: 6px;">'+esc((tenant&&tenant.name)||'—')
      +((tenant&&tenant.archetype)?('<span style="color: rgb(154, 164, 184);"> · '+esc(A[tenant.archetype]||tenant.archetype)+'</span>'):'')+'</div></div>'
      +'<button id="rt-signout" style="width: 100%; text-align: left; border: 0px; background: rgb(255, 255, 255); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; color: rgb(197, 48, 48); padding: 12px 15px; display: flex; align-items: center; gap: 9px;">'
      +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>Cerrar sesión</button>';
    host.appendChild(menu);
    const close=()=>{ menu.style.display='none'; };
    av.addEventListener('click', function(e){
      e.stopPropagation();
      menu.style.display=(menu.style.display==='none')?'block':'none';
    });
    document.addEventListener('click', function(e){ if(!menu.contains(e.target)&&e.target!==av) close(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
    menu.addEventListener('click', async function(e){
      const b=e.target.closest('#rt-signout'); if(!b) return;
      b.disabled=true; b.style.opacity='0.6'; b.textContent='Saliendo…';
      try{ await db.auth.signOut(); }catch(err){}
      location.href='/login';
    });
  }
})();
</script>
