<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutevo — Próximamente</title>
<style>
  :root{ --ink:#0F172A; --blue:#2563EB; --teal:#10B981; --mut:#64748b; --bg:#f7f9fc; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e6edf7; --bg:#0b1220; --mut:#94a3b8; } }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .wrap{max-width:560px}
  .logo{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:28px}
  .logo .wm{font-size:44px;font-weight:800;letter-spacing:-.02em}
  h1{font-size:22px;font-weight:700;margin:0 0 10px}
  p{font-size:15.5px;color:var(--mut);line-height:1.6;margin:0 0 26px}
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--blue);background:rgba(37,99,235,.1);padding:6px 14px;border-radius:20px;margin-bottom:26px}
  a.cta{display:inline-block;color:#fff;background:var(--blue);text-decoration:none;font-weight:600;
    padding:12px 22px;border-radius:10px;font-size:14.5px}
  a.cta:hover{background:#1d4ed8}
  footer{margin-top:34px;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg width="60" height="60" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Rutevo">
        <path d="M11 35 C 20 35, 22 13, 33 13" stroke="#2563EB" stroke-width="4.4" stroke-linecap="round"/>
        <circle cx="11" cy="35" r="5.2" fill="#2563EB"/>
        <circle cx="33" cy="13" r="6.2" fill="#10B981"/>
        <circle cx="33" cy="13" r="2.4" fill="#f7f9fc"/>
      </svg>
      <span class="wm">rutev<span style="color:#2563EB">o</span></span>
    </div>

    <div class="tag">Próximamente</div>
    <h1>Software de gestión de pedidos para operadores logísticos</h1>
    <p>Un solo motor para procesar pedidos, seguir su estado en tiempo real y escalar tu operativa — sin ampliar equipo. Estamos construyéndolo.</p>
    <a class="cta" href="mailto:alberto@rutevo.app">Contacto</a>

    <footer>© 2026 Rutevo · rutevo.app</footer>
  </div>
</body>
</html>
